events {}

http {
    server {
        listen 80;

        # =========================================
        # CORS
        # =========================================

        add_header Access-Control-Allow-Origin "https://orbital-frontend-1vbl.onrender.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # =========================================
        # CORS PREFLIGHT
        # =========================================

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://orbital-frontend-1vbl.onrender.com" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;

            return 204;
        }

        # =========================================
        # AUTH SERVICE
        # =========================================

        location /api/auth/ {
            proxy_pass https://orbital-m3xb.onrender.com;

            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            proxy_ssl_name orbital-m3xb.onrender.com;

            proxy_set_header Host orbital-m3xb.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward incoming cookies
            proxy_set_header Cookie $http_cookie;

            # Forward authentication cookies from Auth Service
            proxy_pass_header Set-Cookie;
        }

        # =========================================
        # USER SERVICE
        # =========================================

        location /api/user/ {
            proxy_pass https://orbital-user-service.onrender.com;

            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            proxy_ssl_name orbital-user-service.onrender.com;

            proxy_set_header Host orbital-user-service.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward incoming cookies
            proxy_set_header Cookie $http_cookie;
        }

        # =========================================
        # POST SERVICE
        # =========================================

        location /api/posts/ {
            proxy_pass https://orbital-post-service.onrender.com;

            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            proxy_ssl_name orbital-post-service.onrender.com;

            proxy_set_header Host orbital-post-service.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward incoming cookies
            proxy_set_header Cookie $http_cookie;
        }

        # =========================================
        # GATEWAY HEALTH
        # =========================================

        location /health {
            return 200 'API Gateway is running';
            add_header Content-Type text/plain;
        }
    }
}