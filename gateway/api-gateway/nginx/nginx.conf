events {}

http {
    server {
        listen 80;

        # =========================================
        # CORS - ONLY NGINX SHOULD ADD THESE
        # =========================================

        add_header Access-Control-Allow-Origin "https://orbital-frontend-1vbl.onrender.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # =========================================
        # AUTH SERVICE
        # =========================================

        location /api/auth/ {

            # Preflight
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass https://orbital-m3xb.onrender.com;

            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            proxy_ssl_name orbital-m3xb.onrender.com;

            proxy_set_header Host orbital-m3xb.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;

            proxy_pass_header Set-Cookie;

            # IMPORTANT: remove CORS headers coming from Auth Service
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # =========================================
        # USER SERVICE
        # =========================================

        location /api/user/ {

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass https://orbital-user-service.onrender.com;

            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            proxy_ssl_name orbital-user-service.onrender.com;

            proxy_set_header Host orbital-user-service.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # =========================================
        # POST SERVICE
        # =========================================

        location /api/posts/ {

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass https://orbital-post-service.onrender.com;

            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            proxy_ssl_name orbital-post-service.onrender.com;

            proxy_set_header Host orbital-post-service.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # =========================================
        # HEALTH
        # =========================================

        location /health {
            return 200 'API Gateway is running';
            add_header Content-Type text/plain;
        }
    }
}
